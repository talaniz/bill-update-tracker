[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bill-update-tracker"
version = "0.1.0"
description = "Track Congress.gov bill update volume for Grafana dashboards."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.111,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.3,<3",
    "uvicorn[standard]>=0.30,<1",
    "congress-py==0.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
