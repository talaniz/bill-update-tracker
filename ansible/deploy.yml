---
- name: Deploy bill update tracker
  hosts: deathstar
  become: true
  gather_facts: true

  vars:
    congress_api_key_from_controller: "{{ lookup('ansible.builtin.env', 'CONGRESS_API_KEY') }}"
    ntfy_auth_users_from_controller: "{{ lookup('ansible.builtin.env', 'NTFY_AUTH_USERS') }}"

  pre_tasks:
    - name: Require local CONGRESS_API_KEY
      ansible.builtin.assert:
        that:
          - congress_api_key_from_controller | length > 0
        fail_msg: "Source ~/.zshrc.secrets on the laptop before deploy so CONGRESS_API_KEY is available to Ansible."
      no_log: true

    - name: Require local NTFY_AUTH_USERS
      ansible.builtin.assert:
        that:
          - ntfy_auth_users_from_controller | length > 0
        fail_msg: "Set NTFY_AUTH_USERS in the deploy environment before deploy so ntfy has at least one authenticated user."
      when: ntfy_enabled | bool
      no_log: true

    - name: Check Docker is installed
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Check Docker Compose is installed
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Check nginx config directory exists
      ansible.builtin.stat:
        path: /etc/nginx/conf.d
      register: nginx_conf_d

    - name: Require nginx conf.d
      ansible.builtin.assert:
        that:
          - nginx_conf_d.stat.isdir
        fail_msg: "/etc/nginx/conf.d does not exist; inspect nginx include paths before deploying proxy config."

    - name: Check ufw status
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: false

  tasks:
    - name: Ensure app parent directory exists
      ansible.builtin.file:
        path: "{{ app_install_dir | dirname }}"
        state: directory
        mode: "0755"

    - name: Clone or update app repository
      ansible.builtin.git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_install_dir }}"
        version: "{{ app_repo_version }}"
        update: true
        force: true

    - name: Ensure ntfy data directory exists
      ansible.builtin.file:
        path: "{{ ntfy_data_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: ntfy_enabled | bool

    - name: Write runtime environment file
      ansible.builtin.template:
        src: tracker.env.j2
        dest: "{{ app_install_dir }}/.env"
        owner: root
        group: root
        mode: "0600"

    - name: Write nginx reverse proxy config
      ansible.builtin.template:
        src: nginx-bill-update-tracker.conf.j2
        dest: "{{ nginx_site_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Validate nginx config
      ansible.builtin.command: "{{ nginx_test_command }}"
      changed_when: false

    - name: Allow HTTP through ufw
      ansible.builtin.command: ufw allow 80/tcp
      register: ufw_allow_http
      changed_when: "'Rule added' in ufw_allow_http.stdout or 'Rules updated' in ufw_allow_http.stdout"
      when:
        - manage_ufw_http | bool
        - "'Status: active' in ufw_status.stdout"

    - name: Apply nginx config before smoke checks
      ansible.builtin.command: "{{ nginx_reload_command }}"
      changed_when: false

    - name: Start tracker stack
      ansible.builtin.command: docker compose --env-file .env up -d --build
      args:
        chdir: "{{ app_install_dir }}"
      environment:
        CONGRESS_API_KEY: "{{ congress_api_key_from_controller }}"
      no_log: true

    - name: Restart Loki and Alloy to reload logging config
      ansible.builtin.command: docker compose restart loki alloy
      args:
        chdir: "{{ app_install_dir }}"
      changed_when: false

    - name: Restart Grafana to reload provisioning
      ansible.builtin.command: docker compose restart grafana
      args:
        chdir: "{{ app_install_dir }}"
      changed_when: false

    - name: Wait for FastAPI health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/health
        return_content: true
      register: fastapi_health
      retries: 20
      delay: 3
      until: fastapi_health.status == 200

    - name: Wait for Grafana through nginx
      ansible.builtin.uri:
        url: "http://127.0.0.1{{ app_public_path }}login"
        headers:
          Host: "{{ app_public_host }}"
        return_content: false
      register: grafana_proxy
      retries: 20
      delay: 3
      until: grafana_proxy.status == 200

    - name: Wait for Loki health endpoint
      ansible.builtin.uri:
        url: "http://{{ loki_host_bind }}:{{ loki_host_port }}/ready"
        return_content: true
      register: loki_health
      retries: 20
      delay: 3
      until: loki_health.status == 200

    - name: Wait for Alloy health endpoint
      ansible.builtin.uri:
        url: "http://{{ alloy_host_bind }}:{{ alloy_host_port }}/-/ready"
        return_content: true
      register: alloy_health
      retries: 20
      delay: 3
      until: alloy_health.status == 200

    - name: Verify Mothership Loki datasource provisioning
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/datasources/uid/mothership-loki
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        return_content: false
      register: loki_datasource
      retries: 20
      delay: 3
      until: loki_datasource.status == 200
      no_log: true

    - name: Verify Mothership Activity dashboard provisioning
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/dashboards/uid/mothership-activity
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        return_content: false
      register: mothership_dashboard
      retries: 20
      delay: 3
      until: mothership_dashboard.status == 200
      no_log: true

    - name: Wait for Mothership landing page
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ app_public_host }}"
        return_content: false
      register: mothership_landing
      retries: 20
      delay: 3
      until: mothership_landing.status == 200

    - name: Wait for ntfy health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ntfy_host_port }}/v1/health"
        return_content: true
      register: ntfy_health
      retries: 20
      delay: 3
      until: ntfy_health.status == 200
      when: ntfy_enabled | bool

    - name: Check Docker services
      ansible.builtin.command: docker compose ps
      args:
        chdir: "{{ app_install_dir }}"
      register: compose_ps
      changed_when: false

    - name: Show deploy summary
      ansible.builtin.debug:
        msg:
          - "Deployed {{ app_repo_url }} {{ app_repo_version }} to {{ app_install_dir }}"
          - "Grafana route: http://{{ app_public_host }}{{ app_public_path }}"
          - "Mothership landing: http://{{ app_public_host }}/"
          - "ntfy route: http://{{ app_public_host }}{{ ntfy_public_path }}"
          - "{{ compose_ps.stdout_lines }}"

  handlers:
    - name: Reload nginx
      ansible.builtin.command: "{{ nginx_reload_command }}"
