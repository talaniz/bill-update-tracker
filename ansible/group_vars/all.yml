app_name: bill-update-tracker
app_install_dir: /opt/bill-update-tracker
app_repo_url: https://github.com/talaniz/bill-update-tracker.git
app_repo_version: main

app_public_host: deathstar.local
app_public_path: /bill-update-tracker/
landing_root: "{{ app_install_dir }}/landing"

tracker_timezone: America/Los_Angeles
poll_interval_seconds: 3600
initial_lookback_days: 0
track_current_congress_only: "true"
target_congress: ""
enable_scheduler: "true"

grafana_admin_user: admin
grafana_admin_password: admin
grafana_host_bind: 127.0.0.1
grafana_root_url: "http://{{ app_public_host }}{{ app_public_path }}"
grafana_serve_from_sub_path: "true"
prometheus_retention: 30d
loki_host_bind: 127.0.0.1
loki_host_port: 3100
alloy_host_bind: 127.0.0.1
alloy_host_port: 12345
alloy_host_label: "{{ app_public_host }}"

ntfy_enabled: true
ntfy_host_bind: 127.0.0.1
ntfy_host_port: 8093
ntfy_public_path: /ntfy/
ntfy_base_url: "http://{{ app_public_host }}{{ ntfy_public_path }}"
ntfy_data_dir: "{{ app_install_dir }}/runtime/ntfy"
ntfy_auth_default_access: deny-all
ntfy_enable_login: "true"

nginx_site_path: /etc/nginx/conf.d/bill-update-tracker.conf
nginx_test_command: /usr/sbin/nginx -t
nginx_reload_command: systemctl reload nginx
manage_ufw_http: true
