services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bill_update_tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d bill_update_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  tracker:
    build: .
    restart: unless-stopped
    secrets:
      - congress_api_key
    environment:
      CONGRESS_API_KEY_FILE: /run/secrets/congress_api_key
      DATABASE_URL: postgresql://tracker:tracker@postgres:5432/bill_update_tracker
      TRACKER_TIMEZONE: ${TRACKER_TIMEZONE:-America/Los_Angeles}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-3600}
      INITIAL_LOOKBACK_DAYS: ${INITIAL_LOOKBACK_DAYS:-0}
      TRACK_CURRENT_CONGRESS_ONLY: ${TRACK_CURRENT_CONGRESS_ONLY:-true}
      TARGET_CONGRESS: ${TARGET_CONGRESS:-}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-false}
    ports:
      - "${GRAFANA_HOST_BIND:-0.0.0.0}:3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  grafana-storage:

secrets:
  congress_api_key:
    environment: CONGRESS_API_KEY
